<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chamba</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#000;color:#fff;height:100dvh;overflow:hidden}
#s1{height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#111b21;text-align:center;padding:20px}
.row{display:flex;gap:15px} .row button{padding:16px 45px;border-radius:30px;border:0;font-weight:900;font-size:18px}
#si{background:#00a884;color:#fff} #no{background:#2a3942;color:#fff}
#s2{display:none;height:100dvh;flex-direction:column;background:#0b141a;position:relative}
.top{text-align:center;padding:35px 0 10px} .videowrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.circle{width:260px;height:260px;border-radius:50%;overflow:hidden;background:#fff}
.circle video{width:100%;height:100%;object-fit:cover}
.bottom{display:flex;justify-content:space-around;padding:30px 20px 40px}
.b{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:#8696a0}
.b div{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px}
.red{background:#f15c6d} .green{background:#00a884;animation:pulse 1s infinite} .gray{background:#2a3942}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="s1"><h1>¿Jalas a la chamba?</h1><p style="color:#8696a0;margin:10px 0 25px">La pala te esta marcando...</p><div class="row"><button id="si">SI</button><button id="no">NO</button></div></div>
<div id="s2">
<div class="top"><h2>chamba</h2></div>
<div class="videowrap"><div class="circle"><video id="v" src="./chamba.mp4" loop playsinline></video></div><div style="margin-top:15px;color:#536069">^ ^ ^</div></div>
<div class="bottom"><div class="b"><div class="red">✕</div>Tolak</div><div class="b" onclick="alert('A CHAMBEAR 12 HORAS 👊')"><div class="green">📞</div>Gesek</div><div class="b"><div class="gray">💬</div>Kirim pesan</div></div>
</div>
<script>
const s1=document.getElementById('s1'), s2=document.getElementById('s2'), v=document.getElementById('v');
document.getElementById('si').onclick=async()=>{s1.style.display='none';s2.style.display='flex';v.muted=false;await v.play();if(navigator.vibrate)navigator.vibrate([500,200,500])}
document.getElementById('no').onclick=()=>{document.getElementById('no').innerText='Di que si we 😔';setTimeout(()=>{s1.style.display='none';s2.style.display='flex';v.play()},800)}
</script>
</body>
</html>
