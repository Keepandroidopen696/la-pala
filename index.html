<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075e54">
<title>La Pala | Llamada entrante</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,system-ui,sans-serif;background:#0b141a;color:#e9edef}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#123b36 0,transparent 48%),#0b141a}
button{font:inherit;border:0;cursor:pointer;color:inherit;touch-action:manipulation}
.screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px}
#incoming{display:flex}.call-card{width:min(100%,430px);text-align:center;padding:30px 24px}
.topline{font-size:13px;letter-spacing:.5px;color:#aebac1;margin-bottom:42px}
.avatar{width:118px;height:118px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:#263b43;border:4px solid #344c54;font-size:62px;box-shadow:0 0 0 8px #ffffff08}
h1{font-size:29px;margin:0 0 9px;font-weight:600}.subtitle{margin:0;color:#aebac1;font-size:15px}
.caller{margin:25px auto 0;color:#d1d9dd;font-size:13px}
.actions{display:flex;justify-content:space-around;gap:38px;margin:72px auto 0;max-width:290px}
.action{display:flex;flex-direction:column;align-items:center;gap:11px;background:transparent;color:#dce3e7;font-size:13px}
.action-icon{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:27px;box-shadow:0 5px 18px #0005}
.decline .action-icon{background:#f15c6d}.answer .action-icon{background:#25d366;color:#073b24}
.action:active .action-icon{transform:scale(.94)}.footer-note{margin:42px 0 0;color:#75858e;font-size:11px}
#call{display:none;flex-direction:column;justify-content:space-between;gap:18px;padding:26px 18px max(26px,env(safe-area-inset-bottom));background:#0b141a}
.call-head{text-align:center;padding-top:8px}.call-head .topline{margin:0 0 13px}.call-head h2{font-size:25px;margin:0 0 6px}.call-head p{font-size:13px;color:#aebac1;margin:0}
.video-stage{width:min(100%,410px);margin:auto;position:relative;border-radius:18px;overflow:hidden;background:#172229;aspect-ratio:4/5;max-height:58vh;max-height:58dvh;display:grid;place-items:center}
.video-stage video{width:100%;height:100%;object-fit:cover;display:block}.video-caption{position:absolute;left:12px;right:12px;bottom:12px;padding:11px;border-radius:10px;background:#0b141acc;text-align:center;font-size:12px;pointer-events:none}
.call-controls{width:min(100%,410px);margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.control{display:flex;flex-direction:column;align-items:center;gap:8px;color:#aebac1;font-size:12px;background:transparent}
.control-icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:#202c33;color:#fff}
.control.end .control-icon{background:#f15c6d}.control.work .control-icon{background:#075e54}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100% - 28px);padding:12px 16px;border-radius:12px;background:#233138;color:#e9edef;font-size:13px;text-align:center;display:none;z-index:5}
@media(max-width:420px){.screen{padding:14px}.actions{margin-top:65px}.video-stage{aspect-ratio:3/4}}
</style>
</head>
<body>
<section class="screen" id="incoming" aria-label="Llamada entrante">
 <main class="call-card">
  <div class="topline">WHATSAPP · LLAMADA ENTRANTE</div>
  <div class="avatar" aria-hidden="true">🪏</div>
  <h1>LA PALA</h1>
  <p class="subtitle">Llamada entrante…</p>
  <div class="caller">¿Jalas a la chamba? · El patrón</div>
  <div class="actions">
   <button class="action decline" id="no" aria-label="Rechazar llamada"><span class="action-icon">✕</span><span>Rechazar</span></button>
   <button class="action answer" id="si" aria-label="Aceptar llamada"><span class="action-icon">☎</span><span>Aceptar</span></button>
  </div>
  <p class="footer-note">La oportunidad laboral no se va a contestar sola.</p>
 </main>
</section>
<section class="screen" id="call" aria-label="Llamada conectada">
 <header class="call-head"><div class="topline">LLAMADA DE WHATSAPP</div><h2>LA PALA 🪏</h2><p>Conectado · A chambear</p></header>
 <div class="video-stage">
  <video id="video" src="chamba.mp4" loop playsinline preload="metadata"></video>
  <div class="video-caption">A CHAMBEAR 12 HORAS 👊</div>
 </div>
 <div class="call-controls">
  <button class="control" id="mute"><span class="control-icon">🔊</span><span>Sonido</span></button>
  <button class="control end" id="end"><span class="control-icon">✕</span><span>Colgar</span></button>
  <button class="control work" id="work"><span class="control-icon">👷</span><span>Chambear</span></button>
 </div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
 const incoming=document.getElementById('incoming'),call=document.getElementById('call');
 const video=document.getElementById('video'),toast=document.getElementById('toast');
 let toastTimer;
 function notify(message){toast.textContent=message;toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.display='none',2500)}
 document.getElementById('si').addEventListener('click',async()=>{
  incoming.style.display='none';call.style.display='flex';
  try{await video.play()}catch(e){video.muted=true;try{await video.play()}catch(err){}notify('No se pudo cargar chamba.mp4. Revisa que esté en el repositorio.')}
 });
 document.getElementById('no').addEventListener('click',()=>notify('La pala volverá a marcar…'));
 document.getElementById('end').addEventListener('click',()=>{
  video.pause();video.currentTime=0;call.style.display='none';incoming.style.display='flex';notify('Llamada finalizada');
 });
 document.getElementById('mute').addEventListener('click',()=>{
  video.muted=!video.muted;document.querySelector('#mute .control-icon').textContent=video.muted?'🔇':'🔊';
  notify(video.muted?'Sonido apagado':'Sonido activado');
 });
 document.getElementById('work').addEventListener('click',()=>notify('¡A CHAMBEAR, SOLDADO! 👊'));
 video.addEventListener('click',()=>{video.muted=!video.muted;document.querySelector('#mute .control-icon').textContent=video.muted?'🔇':'🔊'});
})();
</script>
</body>
</html>
